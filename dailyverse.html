<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Verse - Christ Mandir</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@500;700&family=Playfair+Display:wght@700&family=Lora:ital,wght@1,600&family=Montserrat:wght@800&family=Great+Vibes&family=Oswald:wght@500&family=Merriweather:wght@300&family=Roboto+Slab:wght@600&family=Hind+Guntur:wght@400;600;700&family=Tenali+Ramakrishna&family=Suranna&family=Ramabhadra&family=Mallanna&family=Mandali&family=NTR&family=Peddana&family=Timmana&family=Dhurjati&family=Gurajada&family=Lakki+Reddy&family=Ravi+Prakash&family=Sree+Krushnadevaraya&family=Ponnala&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { 
            --primary: #00897b;
            --primary-gradient: linear-gradient(135deg, #00897b, #4db6ac);
            --gold: #D4AF37; 
            --glass-nav: rgba(255, 255, 255, 0.85);
            --text-main: #2d3436;
            --text-light: #636e72;
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --font-head: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: var(--bg-color); 
            height: 100vh; width: 100vw;
            font-family: var(--font-body); color: var(--text-main);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- 1. HEADERS --- */
        .mobile-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
        }
        .logo-mobile { font-family: var(--font-head); font-weight: 800; font-size: 1.2rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-actions { display: flex; gap: 8px; }
        .head-btn {
            height: 34px; padding: 0 14px; border-radius: 20px; border: none;
            font-family: var(--font-head); font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            display: flex; align-items: center; gap: 5px; cursor: pointer; transition: 0.2s;
        }
        .head-btn:active { transform: scale(0.95); }
        .hb-share { background: #f4f4f4; color: var(--text-main); }
        .hb-share:hover { background: #e0e0e0; }
        .hb-save { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,137,123,0.3); }
        .hb-save:hover { background: #00796b; }

        .desktop-header {
            display: none; height: 70px; width: 100%; background: #fff;
            align-items: center; justify-content: space-between; padding: 0 40px;
            border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 100; flex-shrink: 0;
        }
        .logo { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .dt-nav { display: flex; gap: 20px; align-items: center; }

        .dt-link { 
            text-decoration: none; font-family: var(--font-head); font-size: 0.9rem; color: var(--text-light); 
            font-weight: 600; padding: 10px 20px; border-radius: 25px; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .dt-link:hover { background: rgba(0,137,123,0.08); color: var(--primary); transform: translateY(-2px); }
        .dt-link.active { background: var(--primary); color: white; box-shadow: 0 5px 15px rgba(0,137,123,0.3); }

        /* --- 2. LAYOUT --- */
        main {
            flex: 1; display: flex; width: 100%; height: 100%;
            position: relative; overflow: hidden;
            flex-direction: column; 
            padding-top: 60px;
        }

        .app-shell { width: 100%; height: 100%; display: flex; flex-direction: column; }

        .preview-zone {
            height: 35vh; width: 100%;
            background: radial-gradient(circle at center, #2d3e4e 0%, #1a1c20 100%);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; position: relative;
            padding: 10px; cursor: zoom-in;
            flex-shrink: 0; z-index: 5;
        }

        /* Desktop Floating Tools */
        .desktop-tools {
            display: none; /* Hidden on mobile */
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            flex-direction: column; gap: 15px; z-index: 100;
        }
        
        .dt-float-btn {
            width: 60px; height: 60px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .dt-float-btn:hover { background: rgba(255,255,255,0.2); transform: translateX(-5px); border-color: var(--primary); }
        .dt-float-btn:active { transform: scale(0.95); }
        .dt-btn-icon { font-size: 24px; margin-bottom: 4px; }
        .dt-btn-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        
        .dt-float-btn.save-btn:hover { background: var(--primary); border-color: var(--primary); }


        /* Particles & Rays */
        .holy-rays {
            position: absolute; top: 50%; left: 50%; width: 150vw; height: 150vw;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 255, 255, 0.05) 20deg, transparent 40deg);
            transform: translate(-50%, -50%); animation: rotateRays 60s linear infinite; pointer-events: none; z-index: 1;
        }
        @keyframes rotateRays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .dust-container { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 2; pointer-events: none; }
        .dust-dot { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; opacity: 0; animation: riseUp 10s infinite ease-in; }
        @keyframes riseUp { 0% { transform: translateY(120%) scale(0); opacity: 0; } 20% { opacity: 0.5; } 100% { transform: translateY(-20%) scale(1); opacity: 0; } }

        #card-scaler {
            transform-origin: center center; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5); border-radius: 20px; 
            pointer-events: none; z-index: 10; position: relative;
        }
        .verse-card { pointer-events: auto; width: 380px; height: 506px; position: relative; overflow: hidden; border-radius: 30px; background: #000; border: 0px solid rgba(255,255,255,0.1); }

        /* Effects Layers */
        .vignette-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0) 100%); transition: 0.3s; }
        .noise-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; opacity: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); transition: 0.3s; mix-blend-mode: overlay; }

        /* --- 3. CONTROLS ZONE --- */
        .controls-zone {
            flex: 1; /* Changed to fill remaining space */
            width: 100%; 
            background: var(--panel-bg); display: flex; flex-direction: column;
            border-top: 1px solid #e0e0e0; z-index: 20;
            border-radius: 25px 25px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.05);
            position: relative; margin-bottom: 0;
            overflow: hidden;
        }

        .ctrl-tabs {
            display: flex; height: 50px; border-bottom: 1px solid #f4f4f4; flex-shrink: 0; padding: 0 5px;
            background: #fff; border-radius: 25px 25px 0 0;
        }
        .tab-btn {
            flex: 1; border: none; background: transparent; 
            font-family: var(--font-head); font-size: 0.8rem; font-weight: 700; 
            color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px;
            cursor: pointer; transition: 0.3s; position: relative;
        }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content:''; position: absolute; bottom: 0; left: 30%; width: 40%; height: 3px; background: var(--primary); border-radius: 10px; }

        .ctrl-content {
            flex: 1; overflow-y: auto; padding: 20px;
            display: none; flex-direction: column; gap: 15px;
            /* UPDATED PADDING: increased to 120px to clear the bottom nav on mobile */
            padding-bottom: 120px; 
        }
        .ctrl-content.active { display: flex; }

        /* --- 4. DESKTOP OPTIMIZATION --- */
        @media (min-width: 900px) {
            .mobile-header { display: none; }
            .desktop-header { display: flex; }
            .bottom-nav { display: none !important; }
            
            main { padding-top: 70px; flex-direction: row; max-width: 1400px; margin: 0 auto; height: 100vh; }
            .app-shell { 
                flex-direction: row; width: 100%; height: calc(100% - 40px);
                box-shadow: 0 30px 60px rgba(0,0,0,0.1); border-radius: 30px; overflow: hidden;
                border: 1px solid #fff; margin: 20px; background: #fff;
            }
            .preview-zone { flex: 1.6; height: 100%; border-right: 1px solid #f0f0f0; padding: 40px; }
            .desktop-tools { display: flex; } /* Show tools on desktop */
            
            .controls-zone { width: 420px; height: 100%; flex: none; border-radius: 0; box-shadow: none; border-top: none; margin-bottom: 0; }
            .ctrl-tabs { display: flex; height: 60px; }
            .ctrl-content { padding: 30px; padding-bottom: 20px; border-bottom: 1px solid #f5f5f5; }
            .d-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 20px; margin-bottom: 10px; }
        }
        .d-label { display: none; }
        @media (min-width: 900px) { .d-label { display: block; } }

        /* UI Elements */
        label { font-size: 0.75rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 0.5px; }
        
        textarea {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 12px;
            font-family: 'Hind Guntur', sans-serif; font-size: 14px; color: var(--text-main);
            background: #f9f9f9; resize: vertical; min-height: 140px;
            transition: 0.3s;
        }
        textarea:focus, .ref-input:focus, .text-input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        .ref-input, .text-input, select { width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 12px; font-family: 'Hind Guntur', sans-serif; font-size: 14px; color: var(--text-main); background: #f9f9f9; transition: 0.3s; }
        select { font-family: 'Poppins', sans-serif; font-weight: 600; cursor: pointer; }

        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .flex-wrap-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        
        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.75rem; font-family: var(--font-head); height: 40px; display: flex; align-items: center; justify-content: center; background: #fff; color: var(--text-light); border: 1px solid #e0e0e0; transition: 0.2s; flex: 1; min-width: 60px; }
        .btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
        .btn-dark { background: var(--text-main); color: #fff; border: none; }
        
        input[type=range] { width: 100%; accent-color: var(--primary); margin: 8px 0; }
        input[type="color"] { width: 100%; height: 40px; border: none; background: none; cursor: pointer; padding: 0; }
        input[type="date"] { width: 100%; height: 40px; border: 2px solid #e0e0e0; border-radius: 10px; padding: 0 10px; font-family: var(--font-body); }

        /* Swatches */
        .swatch-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.05); transition: 0.2s; }
        .swatch:hover { transform: scale(1.1); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .swatch.grad-1 { background: linear-gradient(45deg, #FFD700, #FDB931); }
        .swatch.grad-2 { background: linear-gradient(45deg, #00C9FF, #92FE9D); }
        .swatch.grad-3 { background: linear-gradient(45deg, #fc00ff, #00dbde); }

        /* Card Styles */
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 0; transform: scale(1.1); transition: 0.5s; }
        .overlay-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; transition: 0.5s; }
        .inner-frame { position: absolute; top: 20px; left: 20px; right: 20px; bottom: 20px; border-radius: 20px; z-index: 2; pointer-events: none; transition: 0.5s; }
        .content { position: relative; z-index: 4; height: 400px; padding: 45px; display: flex; flex-direction: column; box-sizing: border-box; transition: 0.5s; }
        .v-text { font-size: 28px; line-height: 1.6; font-weight: 700; width: 100%; transition: 0.3s; }
        .v-ref { font-size: 13px; margin-top: 20px; display: inline-block; transition: 0.3s; }
        .pos-center { justify-content: center; align-items: center; text-align: center; }
        .pos-left { justify-content: center; align-items: flex-start; text-align: left; }
        .pos-right { justify-content: center; align-items: flex-end; text-align: right; }
        
        .txt-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 25px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .txt-strip { border-left: 5px solid var(--gold); border-right: 5px solid var(--gold); padding: 0 15px; background: rgba(0,0,0,0.3); }
        .txt-quote::before { content: "“"; font-size: 60px; position: absolute; top: -30px; left: 0; opacity: 0.4; }
        
        /* Banner Styles */
        .banner { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 340px; height: 82px; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.4); border-radius: 18px; transition: 0.3s; }
        .banner.b-solid { background: var(--dark); border: none; }
        .banner.b-gold { background: var(--gold); border: none; }
        .banner.b-minimal { background: transparent; border: none; backdrop-filter: none; }
        .banner.b-boxed { width: 95%; border-radius: 10px; background: rgba(0,0,0,0.8); border: 1px solid #333; }
        .banner.b-gradient { background: linear-gradient(135deg, #2c3e50, #4ca1af); border: none; }
        .banner.b-floating-stripe { bottom: 30px; height: 60px; background: rgba(0,0,0,0.8); border: none; border-top: 3px solid var(--gold); border-radius: 5px; }
        .banner.b-outline-bold { background: transparent; border: 3px solid #fff; backdrop-filter: none; }
        .banner.b-split { background: transparent; border: none; backdrop-filter: none; justify-content: space-between; padding: 0; }
        .banner.b-split .banner-left, .banner.b-split .person-info { background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); padding: 5px 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3); height: 100%; }
        
        .banner-left { display: flex; align-items: center; }
        .logo-img { height: 55px; width: auto; border-radius: 5px; margin-right: 8px; object-fit: contain; }
        .banner-date { font-size: 9px; font-weight: 800; color: #fff; border-left: 1.2px solid rgba(255,255,255,0.4); border-right: 1.2px solid rgba(255,255,255,0.4); padding: 0 8px; white-space: nowrap; letter-spacing: 0.5px; }
        .cross-icon { color: rgba(255, 255, 255, 0.9); margin-right: 8px; width: 14px; height: 14px; flex-shrink: 0; }
        .person-info { display: flex; align-items: center; gap: 10px; }
        .person-text { display: flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.25; }
        .author-name { font-size: 10px; font-weight: 700; color: var(--gold); letter-spacing: 0.3px; white-space: nowrap; }
        .brand-main { font-size: 10px; font-weight: 900; color: #fff; letter-spacing: 0.8px; text-transform: uppercase; white-space: nowrap; }
        .brand-tagline { font-size: 8px; font-weight: 500; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 1.2px; white-space: nowrap; }
        .person-photo { height: 56px; width: 56px; border-radius: 50%; border: 1.5px solid #fff; object-fit: cover; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }

        /* Watermark & Stickers */
        .watermark { 
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); 
            font-size: 10px; text-transform: uppercase; letter-spacing: 3px; font-weight: 800;
            color: rgba(255,255,255,0.4); pointer-events: none; z-index: 8; 
            display: none; width: 100%; text-align: center;
        }
        .sticker-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; display: flex; align-items: center; justify-content: center; }
        .card-icon { font-size: 100px; color: rgba(255,255,255,0.1); display: none; text-shadow: 0 0 10px rgba(0,0,0,0.2); }

        /* --- 5. BOTTOM NAV (Mobile Only) --- */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 380px; height: 70px;
            background: var(--glass-nav);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.6);
            display: flex; justify-content: space-evenly; align-items: center;
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none; color: var(--text-light);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.7rem; font-family: var(--font-head); font-weight: 600;
            padding: 5px 10px; transition: 0.3s;
        }
        .nav-item span { font-size: 1.5rem; margin-bottom: 2px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item.active { color: var(--primary); }
        .nav-item.active span { transform: translateY(-5px) scale(1.1); filter: drop-shadow(0 5px 5px rgba(0,137,123,0.3)); }

        #preview-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 10000; flex-direction: column; justify-content: center; align-items: center; cursor: zoom-out; }
        #preview-img { max-width: 90%; max-height: 90vh; border: 2px solid var(--gold); border-radius: 10px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header class="mobile-header">
        <div class="logo-mobile">Christ <span>Mandir</span></div>
        <div class="header-actions">
            <button class="head-btn hb-share" onclick="shareImage()">🔗 Share</button>
            <button class="head-btn hb-save" onclick="downloadCard()">⬇ Save</button>
        </div>
    </header>

    <header class="desktop-header">
        <div class="logo">Christ <span>Mandir</span></div>
        <div style="display:flex; align-items:center;">
            <nav class="dt-nav">
                <a href="index.html" class="dt-link">🏠 Home</a>
                <a href="bible.html" class="dt-link">📖 Bible</a>
                <a href="stories.html" class="dt-link">📚 Stories</a>
                <a href="quiz.html" class="dt-link">🧩 Quiz</a>
                <a href="dailyverse.html" class="dt-link active">✨ Verse</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="app-shell">
            <div class="preview-zone" onclick="generatePreview()">
                <div class="holy-rays"></div>
                <div class="dust-container" id="dust-container"></div>
                
                <div id="card-scaler">
                    <div class="verse-card" id="mainCard">
                        <div id="bg-layer" class="bg-layer"></div>
                        <div id="overlay-layer" class="overlay-layer"></div>
                        <div id="vignette-layer" class="vignette-layer"></div>
                        <div id="noise-layer" class="noise-layer"></div>
                        <div id="frame-layer" class="inner-frame"></div>
                        <div class="watermark" id="watermark">CHRIST MANDIR</div>
                        <div class="sticker-layer" id="stickerLayer">
                            <div class="card-icon" id="icon-cross">✝</div>
                            <div class="card-icon" id="icon-dove">🕊️</div>
                            <div class="card-icon" id="icon-book">📖</div>
                            <div class="card-icon" id="icon-pray">🙏</div>
                            <div class="card-icon" id="icon-star">✨</div>
                            <div class="card-icon" id="icon-heart">❤️</div>
                            <div class="card-icon" id="icon-crown">👑</div>
                            <div class="card-icon" id="icon-fire">🔥</div>
                            <div class="card-icon" id="icon-anchor">⚓</div>
                            <div class="card-icon" id="icon-leaf">🌿</div>
                            <div class="card-icon" id="icon-fish">🐟</div>
                            <div class="card-icon" id="icon-chalice">🍷</div>
                            <div class="card-icon" id="icon-rays">☀</div>
                            <div class="card-icon" id="icon-wings">👼</div>

    <div id="preview-modal" onclick="closePreview()"><img id="preview-img" src=""></div>

    <script>
    const backgrounds = ["https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=1000", "https://images.unsplash.com/photo-1493246507139-91e8bef99c02?w=1000", "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1000", "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1000", "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000", "https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?w=1000", "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=1000", "https://images.unsplash.com/photo-1518098268026-4e187743369b?w=1000"];
    const fontList = [
        'Hind Guntur', 'Tenali Ramakrishna', 'Suranna', 'Ramabhadra', 
        'Mallanna', 'Mandali', 'NTR', 'Peddana', 'Timmana', 
        'Gurajada', 'Lakki Reddy', 'Ravi Prakash', 'Sree Krushnadevaraya', 'Ponnala', // Telugu
        'Poppins', 'Inter', 'Playfair Display', 'Lora', 'Montserrat', 
        'Great Vibes', 'Oswald', 'Merriweather', 'Roboto Slab' // English/Stylized
    ];
    const frames = ['border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(8px);', 'border: 2px solid #D4AF3733; box-shadow: inset 0 0 40px rgba(0,0,0,0.5);', 'border: 0.5px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);', 'border: none;'];
    
    let currentFontSize = 28;
    let overlayOp = 0.4;
    let nudgeX = 0, nudgeY = 0;
    let iconX = 0, iconY = 0;
    let strokeW = 0, strokeC = '#000000';
    let shadowBlur = 0, shadowC = '#000000';
    let cardBorderW = 0, cardBorderC = '#ffffff';
    const defaultAuthImg = "https://static.wixstatic.com/media/be4f11_18047e27125e4dadaf1a8a064f0271da~mv2.png";

    window.addEventListener('paste', e => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let index in items) {
            const item = items[index];
            if (item.kind === 'file') {
                const blob = item.getAsFile();
                const reader = new FileReader();
                reader.onload = (event) => { document.getElementById('bg-layer').style.backgroundImage = `url(${event.target.result})`; };
                reader.readAsDataURL(blob);
            }
        }
    });

    function init() {
        populateFonts();
        initParticles();
        const now = new Date();
        const istDate = new Intl.DateTimeFormat('en-IN', { timeZone: 'Asia/Kolkata', month: 'short', day: 'numeric', year: 'numeric' }).format(now).toUpperCase();
        document.getElementById('bannerDate').innerText = istDate;
        updateText();
        refreshBackground();
        fitCardToScreen();
        window.addEventListener('resize', fitCardToScreen);
    }
    
    function populateFonts() {
        const sel = document.getElementById('fontSelect');
        fontList.forEach(f => {
            let opt = document.createElement('option');
            opt.value = f;
            opt.innerText = f;
            opt.style.fontFamily = f;
            sel.appendChild(opt);
        });
    }

    function initParticles() {
        const p = document.getElementById('dust-container');
        if(!p) return;
        for(let i=0; i<20; i++) {
            let d = document.createElement('div');
            d.className = 'dust-dot';
            d.style.left = Math.random()*100 + '%';
            d.style.width = Math.random()*4 + 'px';
            d.style.height = d.style.width;
            d.style.animationDuration = (Math.random()*10 + 10) + 's';
            d.style.animationDelay = Math.random()*5 + 's';
            p.appendChild(d);
        }
    }

    function fitCardToScreen() {
        const wrapper = document.getElementById('card-scaler');
        const container = document.querySelector('.preview-zone');
        const cardW = 380;
        let scale = Math.min(container.clientWidth / cardW, container.clientHeight / 506);
        if(scale > 1.1) scale = 1.1;
        wrapper.style.transform = `scale(${scale})`;
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll('.ctrl-content').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-'+tabId).classList.add('active');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function updateText() {
        document.getElementById('verse-text').innerText = document.getElementById('inputVerse').value;
        document.getElementById('verse-ref').innerText = document.getElementById('inputRef').value;
    }
    
    function updateFooter() {
        document.querySelector('.author-name').innerText = document.getElementById('inAuthor').value;
        document.querySelector('.brand-main').innerText = document.getElementById('inBrand').value;
    }
    
    function updateDate(val) {
        if(!val) return;
        const d = new Date(val);
        const formatted = new Intl.DateTimeFormat('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }).format(d).toUpperCase();
        document.getElementById('bannerDate').innerText = formatted;
    }

    function uploadBg(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) { document.getElementById('bg-layer').style.backgroundImage = `url(${e.target.result})`; }
            reader.readAsDataURL(input.files[0]);
        }
    }
    
    function uploadAuth(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) { document.getElementById('authImg').src = e.target.result; }
            reader.readAsDataURL(input.files[0]);
        }
    }
    
    function resetAuthImg() { document.getElementById('authImg').src = defaultAuthImg; }
    
    function clearBackground() { document.getElementById('bg-layer').style.backgroundImage = 'none'; }

    function refreshBackground() {
        const bg = backgrounds[Math.floor(Math.random() * backgrounds.length)];
        document.getElementById('bg-layer').style.backgroundImage = `url(${bg})`;
    }

    /* --- BASIC CONTROLS --- */
    function adjustFontSize(delta) {
        currentFontSize += delta;
        document.getElementById('verse-text').style.fontSize = currentFontSize + "px";
    }

    function alignText(posClass) {
        const content = document.getElementById('content-layer');
        content.classList.remove('pos-center', 'pos-left', 'pos-right', 'pos-top', 'pos-bottom');
        content.classList.add(posClass);
    }
    
    function nudgeText(x, y) {
        nudgeX += x; nudgeY += y;
        document.getElementById('content-layer').style.transform = `translate(${nudgeX}px, ${nudgeY}px)`;
    }
    
    function setVerticalAlign(val) { document.getElementById('content-layer').style.justifyContent = val; }
    function setPadding(val) { document.getElementById('content-layer').style.padding = val + "px"; }

    function setOverlayOpacity(val) { overlayOp = val / 100; setOverlayGradient(); }
    function setOverlayGradient() {
        const c1 = document.getElementById('ovStart').value;
        const c2 = document.getElementById('ovEnd').value;
        const hexToRgb = hex => {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
        }
        const rgb1 = hexToRgb(c1);
        const rgb2 = hexToRgb(c2);
        document.getElementById('overlay-layer').style.background = `linear-gradient(180deg, rgba(${rgb1}, ${overlayOp}), rgba(${rgb2}, ${overlayOp}))`;
    }

    function setFrame(index) { document.getElementById('frame-layer').style.cssText = frames[index]; }
    
    function setFont(font) {
        document.getElementById('verse-text').style.fontFamily = font;
    }
    
    function setRandomFont() {
        const f = fontList[Math.floor(Math.random() * fontList.length)];
        document.getElementById('verse-text').style.fontFamily = f;
        document.getElementById('fontSelect').value = f;
    }

    function setColor(c) {
        const t = document.getElementById('verse-text');
        t.style.color = c; t.style.backgroundImage = 'none'; t.style.webkitTextFillColor = 'initial';
        document.getElementById('verse-ref').style.color = c;
    }
    
    function setTextGradient(type) {
        const t = document.getElementById('verse-text');
        if(type === 'gold') t.style.backgroundImage = 'linear-gradient(45deg, #D4AF37, #FEE140, #D4AF37)';
        if(type === 'ocean') t.style.backgroundImage = 'linear-gradient(45deg, #00C9FF, #92FE9D)';
        if(type === 'sunset') t.style.backgroundImage = 'linear-gradient(45deg, #fc00ff, #00dbde)';
        t.style.webkitBackgroundClip = 'text'; t.style.webkitTextFillColor = 'transparent';
    }

    function refreshStyle() { setRandomFont(); setFrame(Math.floor(Math.random() * 3)); }
    function setBannerStyle(cls) { const b = document.getElementById('cardBanner'); b.className = 'banner ' + cls; }
    
    /* NEW TEXT CONTROLS */
    function setLineHeight(val) { document.getElementById('verse-text').style.lineHeight = val; }
    function setLetterSpacing(val) { document.getElementById('verse-text').style.letterSpacing = val + "px"; }
    function toggleStyle(s) {
        const t = document.getElementById('verse-text');
        if(s==='bold') t.style.fontWeight = t.style.fontWeight==='bold'?'normal':'bold';
        if(s==='italic') t.style.fontStyle = t.style.fontStyle==='italic'?'normal':'italic';
    }
    function toggleDecoration(s) {
        const t = document.getElementById('verse-text');
        t.style.textDecoration = t.style.textDecoration === s ? 'none' : s;
    }
    function setTextTransform(val) { document.getElementById('verse-text').style.textTransform = val; }
    function setRefSize(val) { document.getElementById('verse-ref').style.fontSize = val + 'px'; }
    
    function setTextStroke(val) { strokeW = val; updateStroke(); }
    function setStrokeColor(val) { strokeC = val; updateStroke(); }
    function updateStroke() { document.getElementById('verse-text').style.webkitTextStroke = `${strokeW}px ${strokeC}`; }
    
    function setShadowBlur(val) { shadowBlur = val; updateShadow(); }
    function setShadowColor(val) { shadowC = val; updateShadow(); }
    function updateShadow() {
        document.getElementById('verse-text').style.textShadow = `2px 2px ${shadowBlur}px ${shadowC}`;
    }

    function setTextHighlight(val) {
        document.getElementById('verse-text').style.backgroundColor = val;
    }

    /* CARD DESIGN CONTROLS */
    function setCardBorderWidth(val) { cardBorderW = val; updateCardBorder(); }
    function setCardBorderColor(val) { cardBorderC = val; updateCardBorder(); }
    function updateCardBorder() {
        document.getElementById('mainCard').style.border = `${cardBorderW}px solid ${cardBorderC}`;
    }
    function setCardRadius(val) {
        document.getElementById('mainCard').style.borderRadius = val + 'px';
        document.querySelector('.inner-frame').style.borderRadius = (val - 10) + 'px';
    }
    function setCardBlur(val) {
        // Blur the card background (requires backdrop-filter support on element or pseudo)
        // Since we have image inside, we can't blur the parent easily without blurrying content.
        // We will apply blur to bg-layer 
        // NOTE: This duplicates filter function, so let's combine in updateFilters or just treat it separately if independent.
        // For now, let's make it blur the overlay layer to create a "frosted" look on top of BG.
        // Actually, let's just use it as an alias for image blur for simplicity in this structure.
        updateFilters(); 
    }

    /* FILTERS & EFFECTS */
    function updateFilters() {
        const inputs = document.querySelectorAll('#tab-media input[type=range]');
        const f_bri = inputs[0].value;
        const f_con = inputs[1].value;
        const f_sat = inputs[2].value;
        const f_blur = inputs[3].value;
        document.getElementById('bg-layer').style.filter = `brightness(${f_bri}%) contrast(${f_con}%) saturate(${f_sat}%) blur(${f_blur}px)`;
    }

    function setVignette(val) {
        const v = document.getElementById('vignette-layer');
        // Radial gradient from transparent center to black edges
        // val 0 to 100.
        // 0 = transparent. 100 = strong black corners.
        // We adjust the percentage of the transparent start point.
        // High val = small transparent circle (more vignette). Low val = big circle.
        const stop = 100 - (val * 0.8); // 100 -> 20%, 0 -> 100%
        v.style.background = `radial-gradient(circle, transparent ${stop}%, rgba(0,0,0, ${val/100}) 100%)`;
    }

    function setNoise(val) {
        document.getElementById('noise-layer').style.opacity = val / 100;
    }


    /* DECOR */
    function toggleEl(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
    function setIcon(type) {
        document.querySelectorAll('.card-icon').forEach(i => i.style.display = 'none');
        if(type !== 'none') document.getElementById('icon-'+type).style.display = 'block';
    }
    function setIconColor(val) { document.getElementById('stickerLayer').style.color = val; }
    function setIconRotation(val) { document.getElementById('stickerLayer').style.transform = `translate(${iconX}px, ${iconY}px) rotate(${val}deg)`; }
    function nudgeIcon(x, y) {
        iconX += x; iconY += y;
        document.getElementById('stickerLayer').style.transform = `translate(${iconX}px, ${iconY}px)`;
    }
    function setIconOpacity(val) { document.getElementById('stickerLayer').style.opacity = val/100; }
    function setIconSize(val) { document.querySelectorAll('.card-icon').forEach(i => i.style.fontSize = val + 'px'); }
    function toggleWatermark() {
        const w = document.getElementById('watermark');
        w.style.display = w.style.display === 'block' ? 'none' : 'block';
    }
    function setWatermarkOpacity(val) { document.getElementById('watermark').style.opacity = val/100; }

    function createCaptureClone() {
        const original = document.getElementById('mainCard');
        const clone = original.cloneNode(true);
        clone.style.transform = "none"; clone.style.boxShadow = "none"; clone.style.margin = "0"; clone.style.position = "fixed"; clone.style.left = "-9999px"; clone.style.top = "0"; clone.style.zIndex = "9999";
        const banner = clone.querySelector('.banner');
        banner.style.backdropFilter = "none"; banner.style.webkitBackdropFilter = "none";
        if (!banner.classList.contains('b-solid') && !banner.classList.contains('b-gold')) {
             banner.style.background = "rgba(80, 80, 80, 0.9)"; banner.style.border = "1px solid rgba(255,255,255,0.3)";
        }
        document.body.appendChild(clone);
        return clone;
    }

    async function generatePreview() {
        const clone = createCaptureClone();
        try {
            const canvas = await html2canvas(clone, { useCORS: true, scale: 2, width: 380, height: 506, backgroundColor: null });
            document.getElementById('preview-img').src = canvas.toDataURL("image/png");
            document.getElementById('preview-modal').style.display = 'flex';
        } catch(e) { console.log(e); }
        document.body.removeChild(clone);
    }

    function closePreview() { document.getElementById('preview-modal').style.display = 'none'; }

    async function downloadCard() {
        const btns = document.querySelectorAll('.hb-save, .save-btn'); // Select all save buttons
        const originalTexts = [];
        btns.forEach(b => { 
            if(b.querySelector('.dt-btn-label')) {
                 originalTexts.push(b.querySelector('.dt-btn-label').innerText);
                 b.querySelector('.dt-btn-label').innerText = "Wait...";
            } else {
                 originalTexts.push(b.innerText);
                 b.innerText = "⏳"; 
            }
        });
        
        const clone = createCaptureClone();
        try {
            const canvas = await html2canvas(clone, { useCORS: true, scale: 3, width: 380, height: 506, backgroundColor: null });
            const link = document.createElement('a');
            link.download = `ChristMandir_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch(e) { alert("Download failed"); }
        document.body.removeChild(clone);
        
        btns.forEach((b, i) => { 
            if(b.querySelector('.dt-btn-label')) {
                 b.querySelector('.dt-btn-label').innerText = "Save";
            } else {
                 b.innerText = "Save"; 
            }
        });
    }

    async function shareImage() {
        const clone = createCaptureClone();
        try {
            const canvas = await html2canvas(clone, { useCORS: true, scale: 2, width: 380, height: 506, backgroundColor: null });
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "verse.png", { type: "image/png" });
                if (navigator.share) {
                    await navigator.share({ files: [file], title: 'Daily Verse', text: 'Created with Christ Mandir App' });
                } else {
                    alert("Sharing not supported on this device.");
                }
            });
        } catch(e) { console.log(e); }
        document.body.removeChild(clone);
    }

    init();
    </script>
</body>
